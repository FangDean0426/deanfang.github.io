<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後台控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a1e; }
        .tab-active { border-bottom: 3px solid #22d3ee; color: #22d3ee; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="text-gray-200 min-h-screen">
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-cyan-400">AI作品集 後台管理</h1>
        <button id="logout" class="px-5 py-2 bg-red-500/20 text-red-400 rounded-lg hover:bg-red-500/30">登出</button>
    </header>

    <!-- 分頁標籤 -->
    <div class="flex border-b border-slate-800 px-6">
        <button onclick="switchTab(0)" class="tab px-8 py-4 tab-active" id="tab0">網站設定</button>
        <button onclick="switchTab(1)" class="tab px-8 py-4" id="tab1">作品集管理</button>
    </div>

    <div class="p-8 max-w-4xl mx-auto">
        <!-- 網站設定 -->
        <div id="content0" class="tab-content active">
            <h3 class="text-xl mb-6">修改首頁文字</h3>
            <div class="space-y-6">
                <div>
                    <label class="block mb-2 text-gray-300">首頁標題</label>
                    <textarea id="heroTitle" class="w-full p-4 bg-slate-800 border border-slate-700 rounded-xl h-24"></textarea>
                </div>
                <div>
                    <label class="block mb-2 text-gray-300">首頁介紹</label>
                    <textarea id="heroDesc" class="w-full p-4 bg-slate-800 border border-slate-700 rounded-xl h-24"></textarea>
                </div>
                <div>
                    <label class="block mb-2 text-gray-300">關於我簡介</label>
                    <textarea id="aboutText" class="w-full p-4 bg-slate-800 border border-slate-700 rounded-xl h-40"></textarea>
                </div>
                <button id="saveSite" class="px-8 py-3 bg-cyan-500 hover:bg-cyan-600 text-white font-bold rounded-xl">儲存設定</button>
            </div>
        </div>

        <!-- 作品集管理 -->
        <div id="content1" class="tab-content">
            <h3 class="text-xl mb-6">新增作品</h3>
            <div class="space-y-4 mb-10">
                <input type="text" id="workTitle" placeholder="作品名稱" class="w-full p-4 bg-slate-800 border border-slate-700 rounded-xl">
                <select id="workCate" class="w-full p-4 bg-slate-800 border border-slate-700 rounded-xl">
                    <option value="dashboard">AI平面作品</option>
                    <option value="mobile">AI電商作品</option>
                    <option value="vr">AI短劇</option>
                </select>
                <input type="text" id="workImg" placeholder="作品圖片網址" class="w-full p-4 bg-slate-800 border border-slate-700 rounded-xl">
                <textarea id="workDesc" placeholder="作品簡介" class="w-full p-4 bg-slate-800 border border-slate-700 rounded-xl h-24"></textarea>
                <button id="addWork" class="px-8 py-3 bg-purple-500 hover:bg-purple-600 text-white font-bold rounded-xl">新增作品</button>
            </div>
            <h3 class="text-xl mb-4">現有作品列表</h3>
            <div id="workList" class="space-y-3"></div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>

    <!-- 簡易分頁切換 -->
    <script>
        function switchTab(n) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('content' + n).classList.add('active');
            document.querySelectorAll('.tab').forEach((el, i) => {
                if (i === n) el.classList.add('tab-active');
                else el.classList.remove('tab-active');
            });
        }
    </script>
</body>
</html>
